name: Order
fields:
  id:
    type: string
    required: true
    unique: true
  user_id:
    type: string
    required: true
  total_amount:
    type: float64
    required: true
  status:
    type: string
    defaultValue: pending
    required: true
  items:
    type: array
  created_at:
    type: time
  updated_at:
    type: time
refs:
  user:
    targetSchema: User
    isArray: false
  products:
    targetSchema: Product
    isArray: true
edges:
  - name: order_user
    targetSchema: User
    type: many-to-one
  - name: order_products
    targetSchema: Product
    type: many-to-many
